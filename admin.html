<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>청첩장 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Supabase 미설정 -->
<div class="wrap center" id="setupView" hidden>
  <div class="notice">
    <b>Supabase 연결이 필요합니다.</b><br>
    <code>js/config.js</code> 파일의 <code>SUPABASE_URL</code>과 <code>SUPABASE_ANON_KEY</code>를 입력한 뒤 다시 열어주세요.
    자세한 방법은 <code>SETUP.md</code>를 참고하세요.
  </div>
</div>

<!-- 로그인 -->
<div class="wrap center" id="loginView" hidden>
  <div class="login card">
    <h1>청첩장 관리자</h1>
    <form id="loginForm">
      <input type="email" name="email" placeholder="이메일" required autocomplete="username">
      <input type="password" name="password" placeholder="비밀번호" required autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn primary">로그인</button>
    </form>
  </div>
</div>

<!-- 권한 없음 -->
<div class="wrap center" id="deniedView" hidden>
  <div class="notice">
    <b id="deniedEmail"></b> 계정은 관리자로 등록되어 있지 않습니다.<br>
    Supabase SQL Editor에서 <code>insert into admins (email) values ('이메일');</code> 로 추가하세요.
    <div class="actions"><button class="btn sm" data-logout>로그아웃</button></div>
  </div>
</div>

<!-- 관리 화면 -->
<div id="appView" hidden>
  <header>
    <div class="bar">
      <h1>청첩장 관리자</h1>
      <a href="./" target="_blank">청첩장 보기 ↗</a>
      <button data-logout>로그아웃</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="info" class="on">기본 정보</button>
      <button data-tab="photos">사진</button>
      <button data-tab="rsvp">참석 여부</button>
      <button data-tab="guestbook">방명록</button>
    </nav>
  </header>

  <div class="wrap">
    <div id="tab-info"></div>
    <div id="tab-photos" hidden></div>
    <div id="tab-rsvp" hidden></div>
    <div id="tab-guestbook" hidden></div>
  </div>

  <div class="savebar" id="savebar">
    <div class="in">
      <div class="msg" id="saveMsg">저장된 상태입니다</div>
      <button class="btn primary" id="saveBtn">저장하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
