<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>청첩장 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ec;
    --paper: #ffffff;
    --ink: #2f2925;
    --muted: #857a71;
    --accent: #a5805f;
    --accent-soft: #efe5da;
    --line: #e4dbd0;
    --danger: #c0564a;
    --groom: #5a7bc9;
    --bride: #c9675a;
    --maxw: 760px;  /* 콘텐츠 최대 폭 */
    --side: 0px;    /* PC 사이드 메뉴 폭 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 15px; line-height: 1.6; word-break: keep-all;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px 120px; }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(244,241,236,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar { max-width: var(--maxw); margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-family: "Gowun Batang", serif; font-size: 18px; flex: 1; }
  .bar a, .bar button { font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: none; font-family: inherit; }
  .tabs { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
  .tabs button {
    flex: none; padding: 10px 14px; background: none; border: 0; border-bottom: 2px solid transparent;
    font: inherit; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 16px; }
  .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .card h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .grid .full { grid-column: 1 / -1; }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .tabs { gap: 0; padding: 0 8px; }
    .tabs button { flex: 1; padding: 10px 2px; }
  }
  label.f { display: grid; gap: 4px; }
  label.f span { font-size: 12.5px; color: var(--muted); }
  input, textarea, select {
    width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; color: var(--ink); background: #fff; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row-item { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; margin-bottom: 10px; position: relative; }
  .row-item .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr; gap: 8px; }
  @media (max-width: 520px) { .row-item .grid4 { grid-template-columns: 1fr 1fr; } }
  .row-head { display: flex; justify-content: flex-end; }
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(255,255,255,.95); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .savebar .in { max-width: var(--maxw); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .savebar .msg { flex: 1; font-size: 13px; color: var(--muted); }
  .savebar .msg.dirty { color: var(--danger); }

  /* 로그인 */
  .center { min-height: 80vh; display: grid; place-items: center; }
  .login { width: 100%; max-width: 360px; }
  .login h1 { font-family: "Gowun Batang", serif; font-size: 22px; text-align: center; margin-bottom: 20px; }
  .login form { display: grid; gap: 10px; }
  .err { color: var(--danger); font-size: 13px; min-height: 1.2em; }

  /* 사진 */
  .cover-prev { width: 160px; aspect-ratio: 3/4; border-radius: 10px; background: var(--accent-soft) center/cover; border: 1px solid var(--line); }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .photo { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .photo .img { aspect-ratio: 1; background: var(--accent-soft) center/cover; position: relative; }
  .photo .img b { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 0 7px; border-radius: 999px; }
  .photo .acts { display: flex; justify-content: space-between; padding: 4px; }
  .photo .acts button { background: none; border: 0; padding: 6px 10px; cursor: pointer; font-size: 15px; color: var(--ink); }
  .photo .acts button:disabled { opacity: .25; cursor: default; }
  .photo .acts .del { color: var(--danger); }
  .file-btn input { display: none; }
  .progress { font-size: 13px; color: var(--accent); }

  /* 통계 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat small { color: var(--muted); font-size: 12.5px; display: block; }
  .stat b { font-size: 24px; }
  .stat b em { font-style: normal; font-size: 14px; font-weight: 400; margin-left: 2px; }
  .stat .sub { font-size: 12px; color: var(--muted); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .list { list-style: none; display: grid; gap: 8px; }
  .list li { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .list .body { flex: 1; min-width: 0; }
  .list .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .list .meta { font-size: 12.5px; color: var(--muted); }
  .list p { margin-top: 4px; white-space: pre-line; overflow-wrap: anywhere; font-size: 14px; }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); }
  .tag.groom { background: #e6ecf8; color: var(--groom); }
  .tag.bride { background: #f8e7e4; color: var(--bride); }
  .tag.no { background: #eee; color: #777; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; font-size: 14px; }

  .notice { background: #fff8e6; border: 1px solid #f0dca8; border-radius: 12px; padding: 18px; font-size: 14px; }
  .notice code { background: #f6efe0; padding: 1px 5px; border-radius: 4px; }

  /* ===== 반응형 ===== */
  /* 작은 폰 */
  @media (max-width: 380px) {
    .bar { gap: 8px; }
    .bar h1 { font-size: 16px; }
    .card { padding: 16px 14px; }
    .stat b { font-size: 20px; }
    .list li { flex-direction: column; gap: 8px; }
    .list li > .btn { align-self: flex-end; }
  }
  /* PC: 왼쪽 메뉴 + 기본 정보 2열 */
  @media (min-width: 1024px) {
    :root { --maxw: 1180px; --side: 200px; }
    .bar { padding: 16px 24px; }
    .tabs {
      position: fixed; top: 76px; left: max(24px, calc((100vw - var(--maxw)) / 2 + 24px));
      width: calc(var(--side) - 24px); margin: 0; padding: 0;
      flex-direction: column; gap: 2px; overflow: visible;
    }
    .tabs button {
      text-align: left; padding: 10px 14px; border-bottom: 0; border-left: 3px solid transparent;
      border-radius: 0 8px 8px 0;
    }
    .tabs button:hover { background: rgba(255,255,255,.6); }
    .tabs button.on { border-left-color: var(--accent); background: var(--paper); }
    .wrap { padding: 8px 24px 120px calc(24px + var(--side)); }
    .savebar { padding-left: 0; padding-right: 0; }
    .savebar .in { padding: 0 24px 0 calc(24px + var(--side)); }

    #tab-info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; align-items: start; }
    #tab-info > .wide { grid-column: 1 / -1; }
    #tab-info > .wide .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #tab-info > .wide .grid .full { grid-column: span 2; }
    .row-item .grid4 { grid-template-columns: 1fr 1fr; }
    .photos { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .stats { gap: 16px; }
    .stat { padding: 18px 20px; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px);
    background: rgba(40,34,30,.92); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: all .3s; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- Supabase 미설정 -->
<div class="wrap center" id="setupView" hidden>
  <div class="notice">
    <b>Supabase 연결이 필요합니다.</b><br>
    <code>config.js</code> 파일의 <code>SUPABASE_URL</code>과 <code>SUPABASE_ANON_KEY</code>를 입력한 뒤 다시 열어주세요.
    자세한 방법은 <code>SETUP.md</code>를 참고하세요.
  </div>
</div>

<!-- 로그인 -->
<div class="wrap center" id="loginView" hidden>
  <div class="login card">
    <h1>청첩장 관리자</h1>
    <form id="loginForm">
      <input type="email" name="email" placeholder="이메일" required autocomplete="username">
      <input type="password" name="password" placeholder="비밀번호" required autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn primary">로그인</button>
    </form>
  </div>
</div>

<!-- 권한 없음 -->
<div class="wrap center" id="deniedView" hidden>
  <div class="notice">
    <b id="deniedEmail"></b> 계정은 관리자로 등록되어 있지 않습니다.<br>
    Supabase SQL Editor에서 <code>insert into admins (email) values ('이메일');</code> 로 추가하세요.
    <div style="margin-top:12px"><button class="btn sm" data-logout>로그아웃</button></div>
  </div>
</div>

<!-- 관리 화면 -->
<div id="appView" hidden>
  <header>
    <div class="bar">
      <h1>청첩장 관리자</h1>
      <a href="./" target="_blank">청첩장 보기 ↗</a>
      <button data-logout>로그아웃</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="info" class="on">기본 정보</button>
      <button data-tab="photos">사진</button>
      <button data-tab="rsvp">참석 여부</button>
      <button data-tab="guestbook">방명록</button>
    </nav>
  </header>

  <div class="wrap">
    <div id="tab-info"></div>
    <div id="tab-photos" hidden></div>
    <div id="tab-rsvp" hidden></div>
    <div id="tab-guestbook" hidden></div>
  </div>

  <div class="savebar" id="savebar">
    <div class="in">
      <div class="msg" id="saveMsg">저장된 상태입니다</div>
      <button class="btn primary" id="saveBtn">저장하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}
function showView(id) {
  ["setupView", "loginView", "deniedView", "appView"].forEach((v) => { $("#" + v).hidden = v !== id; });
}

/* ---------- 인증 ---------- */
async function boot() {
  if (!sb) return showView("setupView");
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showView("loginView");
  const { data: ok, error } = await sb.rpc("is_admin");
  if (error || !ok) {
    $("#deniedEmail").textContent = session.user.email;
    return showView("deniedView");
  }
  await loadSettings();
  showView("appView");
  renderInfo();
  renderPhotos();
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target.elements;
  $("#loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
  if (error) { $("#loginErr").textContent = "이메일 또는 비밀번호가 올바르지 않습니다."; return; }
  boot();
});
document.addEventListener("click", async (e) => {
  if (!e.target.closest("[data-logout]")) return;
  if (dirty && !confirm("저장하지 않은 변경사항이 있습니다. 로그아웃할까요?")) return;
  dirty = false;
  await sb.auth.signOut();
  showView("loginView");
});

/* ---------- 탭 ---------- */
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  const tab = b.dataset.tab;
  $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $$("[id^=tab-]").forEach((p) => { p.hidden = p.id !== "tab-" + tab; });
  $("#savebar").hidden = !(tab === "info" || tab === "photos");
  if (tab === "rsvp") loadRsvp();
  if (tab === "guestbook") loadGuestbook();
});

/* ---------- 설정 (기본 정보 + 사진) ---------- */
let state = null, dirty = false;

async function loadSettings() {
  const { data, error } = await sb.from("settings").select("data").eq("id", 1).maybeSingle();
  if (error) toast("설정을 불러오지 못했습니다");
  state = { ...clone(DEFAULT_CONFIG), ...(data?.data || {}) };
}
function setDirty(v) {
  dirty = v;
  const m = $("#saveMsg");
  m.textContent = v ? "저장하지 않은 변경사항이 있습니다" : "저장된 상태입니다";
  m.classList.toggle("dirty", v);
}
async function saveSettings() {
  const btn = $("#saveBtn"); btn.disabled = true;
  const { error } = await sb.from("settings").upsert({ id: 1, data: state, updated_at: new Date().toISOString() });
  btn.disabled = false;
  if (error) { console.error(error); toast("저장 실패: " + error.message); return false; }
  setDirty(false); toast("저장되었습니다");
  return true;
}
$("#saveBtn").onclick = saveSettings;
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

const getPath = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
function setPath(o, p, v) {
  const ks = p.split(".");
  let a = o;
  ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; });
  a[ks.at(-1)] = v;
}

const TEMPLATES = {
  transport: () => ({ title: "", desc: "" }),
  "accounts.groom": () => ({ role: "", name: "", bank: "", number: "" }),
  "accounts.bride": () => ({ role: "", name: "", bank: "", number: "" }),
};

function renderInfo() {
  const field = (k, label, attrs = "") =>
    `<label class="f"><span>${label}</span><input data-k="${k}" value="${esc(getPath(state, k))}" ${attrs}></label>`;
  const person = (who, title) => `
    <div class="card"><h2>${title}</h2><div class="grid">
      ${field(`${who}.name`, "이름")}
      ${field(`${who}.phone`, "연락처", 'type="tel"')}
      ${field(`${who}.father`, "아버지 성함")}
      ${field(`${who}.fatherPhone`, "아버지 연락처", 'type="tel"')}
      ${field(`${who}.mother`, "어머니 성함")}
      ${field(`${who}.motherPhone`, "어머니 연락처", 'type="tel"')}
      ${field(`${who}.relation`, "관계 (예: 장남, 차녀)")}
    </div></div>`;
  const accList = (side, title) => `
    <div class="card"><h2>${title}<button class="btn sm" data-add="accounts.${side}">+ 계좌 추가</button></h2>
      ${(state.accounts?.[side] || []).map((a, i) => `
        <div class="row-item">
          <div class="grid4">
            <input data-k="accounts.${side}.${i}.role" value="${esc(a.role)}" placeholder="관계 (예: 신랑)">
            <input data-k="accounts.${side}.${i}.name" value="${esc(a.name)}" placeholder="예금주">
            <input data-k="accounts.${side}.${i}.bank" value="${esc(a.bank)}" placeholder="은행">
            <input data-k="accounts.${side}.${i}.number" value="${esc(a.number)}" placeholder="계좌번호" inputmode="numeric">
          </div>
          <div class="row-head"><button class="btn sm danger" data-del="accounts.${side}.${i}">삭제</button></div>
        </div>`).join("") || `<div class="empty">등록된 계좌가 없습니다</div>`}
    </div>`;

  $("#tab-info").innerHTML = `
    ${person("groom", "신랑측")}
    ${person("bride", "신부측")}
    <div class="card wide"><h2>예식 정보</h2><div class="grid">
      <label class="f"><span>예식 일시 (한국 시간)</span><input type="datetime-local" id="dateInput" value="${esc(String(state.date).slice(0, 16))}"></label>
      ${field("venue.tel", "예식장 전화번호", 'type="tel"')}
      ${field("venue.name", "예식장 이름")}
      ${field("venue.hall", "홀 이름 (예: 3층 그랜드볼룸)")}
      <div class="full">${field("venue.address", "주소")}</div>
      <div class="full">${field("venue.mapQuery", "지도 검색어 (지도에서 정확히 찾아지는 이름이나 주소)")}</div>
    </div></div>
    <div class="card wide"><h2>인사말</h2>
      <textarea data-k="greeting" rows="8">${esc(state.greeting)}</textarea>
    </div>
    <div class="card wide"><h2>교통편 안내<button class="btn sm" data-add="transport">+ 항목 추가</button></h2>
      ${(state.transport || []).map((t, i) => `
        <div class="row-item">
          <input data-k="transport.${i}.title" value="${esc(t.title)}" placeholder="제목 (예: 지하철)">
          <textarea data-k="transport.${i}.desc" rows="2" placeholder="안내 내용">${esc(t.desc)}</textarea>
          <div class="row-head"><button class="btn sm danger" data-del="transport.${i}">삭제</button></div>
        </div>`).join("") || `<div class="empty">등록된 안내가 없습니다</div>`}
    </div>
    ${accList("groom", "신랑측 계좌")}
    ${accList("bride", "신부측 계좌")}
  `;
}

$("#tab-info").addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "dateInput") { if (el.value) { state.date = el.value + ":00+09:00"; setDirty(true); } return; }
  if (el.dataset.k) { setPath(state, el.dataset.k, el.value); setDirty(true); }
});
$("#tab-info").addEventListener("click", (e) => {
  const add = e.target.closest("[data-add]");
  if (add) {
    const p = add.dataset.add;
    if (!getPath(state, p)) setPath(state, p, []);
    getPath(state, p).push(TEMPLATES[p]());
    setDirty(true); renderInfo(); return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    const ks = del.dataset.del.split("."), idx = Number(ks.pop());
    getPath(state, ks.join(".")).splice(idx, 1);
    setDirty(true); renderInfo();
  }
});

/* ---------- 사진 ---------- */
function resize(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob((b) => b ? resolve(b) : reject(new Error("변환 실패")), "image/jpeg", 0.85);
    };
    img.onerror = () => reject(new Error("이미지를 읽을 수 없습니다 (JPG/PNG를 사용해 주세요)"));
    img.src = URL.createObjectURL(file);
  });
}
async function upload(file, folder) {
  const blob = await resize(file);
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}
async function removeStored(url) {
  const p = url && url.split("/storage/v1/object/public/photos/")[1];
  if (p) await sb.storage.from("photos").remove([decodeURIComponent(p)]);
}
const bgUrl = (u) => `background-image:url('${esc(String(u).replace(/'/g, "%27"))}')`;

function renderPhotos() {
  const gal = state.gallery || [];
  $("#tab-photos").innerHTML = `
    <div class="card"><h2>커버 사진 <small>세로(3:4) 사진을 추천합니다</small></h2>
      <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
        <div class="cover-prev" style="${state.coverImage ? bgUrl(state.coverImage) : ""}"></div>
        <label class="btn file-btn">사진 변경<input type="file" accept="image/*" id="coverFile"></label>
      </div>
    </div>
    <div class="card"><h2>갤러리 <small>${gal.length}장 · 화살표로 순서 변경</small>
      <label class="btn sm primary file-btn">+ 사진 추가<input type="file" accept="image/*" multiple id="galFile"></label></h2>
      <div class="progress" id="upProgress"></div>
      <div class="photos">${gal.map((u, i) => `
        <div class="photo">
          <div class="img" style="${bgUrl(u)}"><b>${i + 1}</b></div>
          <div class="acts">
            <button data-move="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="앞으로">◀</button>
            <button class="del" data-remove="${i}" aria-label="삭제">✕</button>
            <button data-move="${i}" data-dir="1" ${i === gal.length - 1 ? "disabled" : ""} aria-label="뒤로">▶</button>
          </div>
        </div>`).join("") || `<div class="empty">갤러리 사진이 없습니다</div>`}
      </div>
    </div>
    <p class="empty">사진 변경은 바로 저장됩니다.</p>`;
}

$("#tab-photos").addEventListener("change", async (e) => {
  const prog = $("#upProgress");
  try {
    if (e.target.id === "coverFile" && e.target.files[0]) {
      toast("업로드 중...");
      const old = state.coverImage;
      state.coverImage = await upload(e.target.files[0], "cover");
      if (await saveSettings()) removeStored(old);
      renderPhotos();
    }
    if (e.target.id === "galFile" && e.target.files.length) {
      const files = [...e.target.files];
      state.gallery = state.gallery || [];
      for (let i = 0; i < files.length; i++) {
        prog.textContent = `업로드 중... (${i + 1}/${files.length})`;
        state.gallery.push(await upload(files[i], "gallery"));
      }
      await saveSettings();
      renderPhotos();
    }
  } catch (err) {
    console.error(err);
    toast("업로드 실패: " + err.message);
    if (prog) prog.textContent = "";
  }
});
$("#tab-photos").addEventListener("click", async (e) => {
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const i = Number(mv.dataset.move), j = i + Number(mv.dataset.dir), g = state.gallery;
    [g[i], g[j]] = [g[j], g[i]];
    renderPhotos(); await saveSettings(); return;
  }
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    if (!confirm("이 사진을 삭제할까요?")) return;
    const [url] = state.gallery.splice(Number(rm.dataset.remove), 1);
    renderPhotos();
    if (await saveSettings()) removeStored(url);
  }
});

/* ---------- 참석 여부 ---------- */
let rsvps = [], rsvpFilter = "all";
const MEAL = { yes: "식사", no: "식사 안 함", undecided: "식사 미정" };
const SIDE = { groom: "신랑측", bride: "신부측" };
const fmtDate = (iso) => new Date(iso).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

async function loadRsvp() {
  $("#tab-rsvp").innerHTML = `<div class="empty">불러오는 중...</div>`;
  const { data, error } = await sb.from("rsvp").select("*").order("created_at", { ascending: false });
  if (error) { $("#tab-rsvp").innerHTML = `<div class="empty">불러오기 실패: ${esc(error.message)}</div>`; return; }
  rsvps = data; renderRsvp();
}
function renderRsvp() {
  const sum = (arr) => arr.reduce((s, r) => s + (r.count || 0), 0);
  const yes = rsvps.filter((r) => r.attend);
  const bySide = (s) => yes.filter((r) => r.side === s);
  const meal = yes.filter((r) => r.meal === "yes");
  const list = rsvps.filter((r) =>
    rsvpFilter === "all" ? true : rsvpFilter === "no" ? !r.attend : r.attend && r.side === rsvpFilter);

  $("#tab-rsvp").innerHTML = `
    <div class="stats" style="margin-top:16px">
      <div class="stat"><small>총 참석 인원</small><b>${sum(yes)}<em>명</em></b><div class="sub">응답 ${rsvps.length}건 · 불참 ${rsvps.length - yes.length}건</div></div>
      <div class="stat"><small>신랑측</small><b>${sum(bySide("groom"))}<em>명</em></b><div class="sub">${bySide("groom").length}건</div></div>
      <div class="stat"><small>신부측</small><b>${sum(bySide("bride"))}<em>명</em></b><div class="sub">${bySide("bride").length}건</div></div>
      <div class="stat"><small>식사 인원</small><b>${sum(meal)}<em>명</em></b><div class="sub">미정 ${sum(yes.filter((r) => r.meal === "undecided"))}명</div></div>
    </div>
    <div class="card">
      <h2>응답 목록
        <span style="display:flex;gap:6px">
          <button class="btn sm" id="rsvpReload">새로고침</button>
          <button class="btn sm" id="rsvpCsv">엑셀(CSV) 받기</button>
        </span>
      </h2>
      <div class="filters" style="margin-bottom:12px">
        ${[["all", "전체"], ["groom", "신랑측 참석"], ["bride", "신부측 참석"], ["no", "불참"]].map(([v, l]) =>
          `<button data-filter="${v}" class="${rsvpFilter === v ? "on" : ""}">${l}</button>`).join("")}
      </div>
      <ul class="list">${list.map((r) => `
        <li><div class="body">
          <div class="top">
            <b>${esc(r.name)}</b>${r.phone4 ? `<span class="meta">(${esc(r.phone4)})</span>` : ""}
            <span class="tag ${r.side}">${SIDE[r.side]}</span>
            ${r.attend ? `<span class="tag">${r.count}명</span><span class="tag">${MEAL[r.meal] || "-"}</span>` : `<span class="tag no">불참</span>`}
          </div>
          ${r.note ? `<p>${esc(r.note)}</p>` : ""}
          <div class="meta">${fmtDate(r.created_at)}</div>
        </div><button class="btn sm danger" data-rsvp-del="${r.id}">삭제</button></li>`).join("") || `<div class="empty">응답이 없습니다</div>`}
      </ul>
    </div>`;
}
$("#tab-rsvp").addEventListener("click", async (e) => {
  const f = e.target.closest("[data-filter]");
  if (f) { rsvpFilter = f.dataset.filter; renderRsvp(); return; }
  if (e.target.id === "rsvpReload") return loadRsvp();
  if (e.target.id === "rsvpCsv") return downloadCsv();
  const d = e.target.closest("[data-rsvp-del]");
  if (d && confirm("이 응답을 삭제할까요?")) {
    const { error } = await sb.from("rsvp").delete().eq("id", d.dataset.rsvpDel);
    if (error) return toast("삭제 실패: " + error.message);
    rsvps = rsvps.filter((r) => String(r.id) !== d.dataset.rsvpDel);
    renderRsvp(); toast("삭제되었습니다");
  }
});
function downloadCsv() {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["구분", "성함", "연락처 뒷자리", "참석", "인원", "식사", "메시지", "등록일시"]].concat(
    rsvps.map((r) => [SIDE[r.side], r.name, r.phone4, r.attend ? "참석" : "불참", r.attend ? r.count : 0,
      r.attend ? MEAL[r.meal] || "" : "", r.note, new Date(r.created_at).toLocaleString("ko-KR")]));
  const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `참석여부_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- 방명록 ---------- */
async function loadGuestbook() {
  const el = $("#tab-guestbook");
  el.innerHTML = `<div class="empty">불러오는 중...</div>`;
  const { data, error } = await sb.from("guestbook").select("*").order("created_at", { ascending: false });
  if (error) { el.innerHTML = `<div class="empty">불러오기 실패: ${esc(error.message)}</div>`; return; }
  el.innerHTML = `
    <div class="card"><h2>방명록 <small>${data.length}개</small><button class="btn sm" id="gbReload">새로고침</button></h2>
      <ul class="list">${data.map((r) => `
        <li><div class="body">
          <div class="top"><b>${esc(r.name)}</b><span class="meta">${fmtDate(r.created_at)}</span></div>
          <p>${esc(r.message)}</p>
        </div><button class="btn sm danger" data-gb-del="${r.id}">삭제</button></li>`).join("") || `<div class="empty">아직 메시지가 없습니다</div>`}
      </ul>
    </div>`;
}
$("#tab-guestbook").addEventListener("click", async (e) => {
  if (e.target.id === "gbReload") return loadGuestbook();
  const d = e.target.closest("[data-gb-del]");
  if (d && confirm("이 메시지를 삭제할까요?")) {
    const { error } = await sb.from("guestbook").delete().eq("id", d.dataset.gbDel);
    if (error) return toast("삭제 실패: " + error.message);
    toast("삭제되었습니다"); loadGuestbook();
  }
});

boot();
</script>
